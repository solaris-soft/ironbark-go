name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          # Automatically caches your go modules
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build Echo server
        run: go build -o server ./cmd/server
